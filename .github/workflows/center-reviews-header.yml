name: Center reviews header

on:
  push:
    paths:
      - '.github/workflows/center-reviews-header.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center reviews hero content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reviews.html')
          s = p.read_text(encoding='utf-8')
          marker = '.reviews-hero{padding:'
          rules = '\nbody[data-page="reviews"] .reviews-hero .container{text-align:center}body[data-page="reviews"] .reviews-hero h1{margin-left:auto;margin-right:auto}body[data-page="reviews"] .reviews-hero p{max-width:720px;margin-left:auto;margin-right:auto}body[data-page="reviews"] .review-source{justify-content:center}\n'
          if 'body[data-page="reviews"] .reviews-hero .container{text-align:center}' not in s:
              s = s.replace('</style>', rules + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reviews.html .github/workflows/center-reviews-header.yml
          git commit -m 'Center reviews page header' || exit 0
          git rm .github/workflows/center-reviews-header.yml
          git commit -m 'Remove temporary reviews header workflow'
          git push